<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENAI Esports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d12;
  --bg2: #12151d;
  --card: #171b25;
  --line: #262b38;
  --text: #eef0f5;
  --muted: #8b92a5;
  --red: #e30613;
  --red2: #ff3341;
  --ok: #2ecc71;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .brand, .btn, .chip { font-family: Rajdhani, Inter, sans-serif; letter-spacing: .02em; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* ---------- Marca ---------- */
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; }
.brand .logo {
  width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
  background: var(--red); font-size: 20px; color: #fff; transform: skewX(-8deg);
  box-shadow: 0 0 18px rgba(227, 6, 19, .45);
}
.brand b { color: var(--red2); font-weight: 700; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 22px; border-radius: 10px; font-weight: 700; font-size: 17px;
  text-transform: uppercase; transition: transform .12s, background .15s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: var(--red2); }
.btn-ghost { background: var(--bg2); border: 1px solid var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Login ---------- */
#auth {
  min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(227, 6, 19, .22), transparent 60%),
    radial-gradient(700px 500px at 90% 90%, rgba(60, 90, 255, .14), transparent 60%),
    var(--bg);
}
.auth-box {
  width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 32px 28px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
}
.auth-box .brand { justify-content: center; font-size: 28px; margin-bottom: 6px; }
.auth-box .sub { text-align: center; color: var(--muted); margin-bottom: 24px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg2); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.tabs button { height: 38px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.tabs button.on { background: var(--line); color: var(--text); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input {
  width: 100%; height: 46px; padding: 0 14px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line); outline: none; transition: border-color .15s;
}
.field input:focus { border-color: var(--red); }
.auth-box .btn { width: 100%; margin-top: 6px; }
.msg { min-height: 22px; font-size: 13px; margin-top: 12px; text-align: center; color: var(--red2); }
.msg.ok { color: var(--ok); }
.note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }

/* ---------- Hub ---------- */
header {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
  padding: 12px 24px; background: rgba(11, 13, 18, .88); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.search {
  flex: 1; max-width: 420px; margin-left: auto; height: 40px; padding: 0 14px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line); outline: none;
}
.search:focus { border-color: var(--red); }
.user { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; color: #fff; font-family: Rajdhani, sans-serif; font-size: 18px;
}
.user .name { font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logout { color: var(--muted); font-size: 13px; padding: 6px 10px; border-radius: 8px; }
.logout:hover { color: var(--text); background: var(--bg2); }

main { max-width: 1240px; margin: 0 auto; padding: 24px; }

.hero {
  position: relative; border-radius: 20px; overflow: hidden; min-height: 300px;
  display: flex; align-items: flex-end; border: 1px solid var(--line); cursor: pointer;
}
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.8), rgba(0,0,0,.1) 70%); }
.hero-info { position: relative; z-index: 1; padding: 32px; max-width: 560px; }
.hero-info .tag { display: inline-block; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 6px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .06em; }
.hero-info h2 { font-size: 46px; line-height: 1; margin-bottom: 10px; }
.hero-info p { color: #cfd3dd; margin-bottom: 18px; }

.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 32px 0 14px; flex-wrap: wrap; }
.section-head h3 { font-size: 24px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  height: 34px; padding: 0 14px; border-radius: 999px; background: var(--bg2);
  border: 1px solid var(--line); font-weight: 600; font-size: 15px; color: var(--muted);
}
.chip:hover { color: var(--text); }
.chip.on { background: var(--red); border-color: var(--red); color: #fff; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.card {
  text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; transition: transform .15s, border-color .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-4px); border-color: var(--red); box-shadow: 0 12px 30px rgba(227, 6, 19, .18); }
.card .thumb { position: relative; aspect-ratio: 16 / 10; }
.card canvas { display: block; width: 100%; height: 100%; }
.badge {
  position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 700; padding: 3px 8px;
  border-radius: 6px; text-transform: uppercase; letter-spacing: .05em;
}
.badge.live { background: var(--ok); color: #062611; }
.badge.soon { background: rgba(0, 0, 0, .65); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.card .body { padding: 12px 14px 14px; }
.card h4 { font-family: Rajdhani, sans-serif; font-size: 20px; line-height: 1.2; }
.card .meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; margin-top: 4px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; grid-column: 1 / -1; }

footer { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 16px; }

/* ---------- Modal do jogo ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .7); backdrop-filter: blur(4px);
  display: grid; place-items: center; padding: 16px; animation: fade .15s;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  position: relative; width: 100%; max-width: 820px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; animation: pop .18s;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.modal .cover { position: relative; aspect-ratio: 16 / 7; }
.modal .cover canvas { width: 100%; height: 100%; display: block; }
.modal .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--card), transparent 55%); }
.close {
  position: absolute; top: 12px; right: 12px; z-index: 2; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(0, 0, 0, .6); font-size: 20px; line-height: 1;
}
.close:hover { background: var(--red); }
.modal .content { padding: 0 28px 28px; margin-top: -40px; position: relative; z-index: 1; }
.modal h2 { font-size: 40px; line-height: 1.05; }
.modal .genre { color: var(--red2); font-weight: 600; margin-bottom: 14px; }
.modal .desc { color: #cfd3dd; margin-bottom: 20px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat span { font-weight: 600; }
.modal h5 { font-family: Rajdhani, sans-serif; font-size: 18px; margin-bottom: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.controls div { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.controls kbd { font-family: inherit; font-weight: 700; color: var(--text); margin-right: 6px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn-red { min-width: 180px; }

@media (max-width: 640px) {
  header { padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .search { order: 3; max-width: none; flex-basis: 100%; }
  .user .name { display: none; }
  main { padding: 16px; }
  .hero { min-height: 260px; }
  .hero-info { padding: 20px; }
  .hero-info h2 { font-size: 34px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .modal .content { padding: 0 18px 20px; }
  .modal h2 { font-size: 30px; }
}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<section id="auth">
  <div class="auth-box">
    <div class="brand"><div class="logo">S</div>SENAI <b>Esports</b></div>
    <p class="sub">Entre para acessar os jogos</p>
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">Entrar</button>
      <button type="button" id="tabSignup">Criar conta</button>
    </div>
    <form id="authForm" autocomplete="on">
      <div class="field">
        <label for="fUser">Usuário</label>
        <input id="fUser" name="username" autocomplete="username" maxlength="20" required>
      </div>
      <div class="field">
        <label for="fPass">Senha</label>
        <input id="fPass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="field hidden" id="confirmWrap">
        <label for="fPass2">Confirmar senha</label>
        <input id="fPass2" type="password" autocomplete="new-password">
      </div>
      <button class="btn btn-red" id="authBtn" type="submit">Entrar</button>
      <div class="msg" id="authMsg"></div>
    </form>
    <p class="note">As contas ficam salvas neste navegador.</p>
  </div>
</section>

<!-- ======================= HUB ======================= -->
<section id="hub" class="hidden">
  <header>
    <div class="brand"><div class="logo">S</div><span>SENAI <b>Esports</b></span></div>
    <input class="search" id="search" type="search" placeholder="Buscar jogos...">
    <div class="user">
      <div class="avatar" id="avatar"></div>
      <span class="name" id="userName"></span>
      <button class="logout" id="logout" type="button">Sair</button>
    </div>

  <main>
    <div class="hero" id="hero">
      <canvas id="heroCanvas"></canvas>
      <div class="hero-info">
        <span class="tag">Destaque</span>
        <h2 id="heroTitle"></h2>
        <p id="heroDesc"></p>
        <button class="btn btn-red" id="heroBtn" type="button">Ver jogo</button>
      </div>
    </div>

    <div class="section-head">
      <h3>Jogos</h3>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <footer>SENAI Esports &middot; Hub de jogos</footer>
</section>

<!-- ======================= MODAL ======================= -->
<div class="overlay hidden" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose" type="button" aria-label="Fechar">&times;</button>
    <div class="cover"><canvas id="mCanvas"></canvas></div>
    <div class="content">
      <h2 id="mTitle"></h2>
      <div class="genre" id="mGenre"></div>
      <p class="desc" id="mDesc"></p>
      <div class="stats" id="mStats"></div>
      <h5>Controles</h5>
      <div class="controls" id="mControls"></div>
      <div class="actions">
        <button class="btn btn-red" id="mPlay" type="button">&#9654; Jogar</button>
        <button class="btn btn-ghost" id="mBack" type="button">Voltar</button>
      </div>
    </div>
  </div>
</div>

<script>
// =====================================================================
// Catálogo de jogos.
// Para adicionar um jogo: copie um objeto, defina `url` (caminho ou link
// do jogo) e `status: 'live'`. Jogos com status 'soon' aparecem como
// "Em breve" e o botão Jogar fica desativado.
// `art` é a função que desenha a capa (tudo procedural, sem imagens).
// =====================================================================
const GAMES = [
  {

    title: 'Poeira Morta',

    controls: [['WASD', 'Mover'], ['Mouse', 'Mirar'], ['Clique', 'Atirar'], ['R', 'Recarregar'], ['E', 'Comprar'], ['Espaço', 'Pular'], ['Ctrl', 'Agachar'], ['G', 'Granada']],

    desc: 'Corridas arcade em pistas neon com drift, turbo e atalhos secretos. Dispute contra os colegas de turma e suba no ranking da escola.',
    controls: [['WASD', 'Dirigir'], ['Espaço', 'Drift'], ['Shift', 'Turbo']],
    color: '#7c4dff',
    art: artCorrida,
  },
  {
    id: 'bloco-arena',
    title: 'Bloco Arena',
    genre: 'Construção • Batalha',
    category: 'Aventura',
    status: 'soon',
    url: '',
    players: '2–16 jogadores',
    platform: 'Navegador',
    rating: '10+',
    short: 'Construa, defenda e conquiste em mundos de blocos.',
    desc: 'Mundo de blocos onde cada equipe constrói sua base e tenta capturar a bandeira adversária. Colete recursos, monte defesas e trabalhe em equipe.',
    controls: [['WASD', 'Mover'], ['Clique', 'Quebrar'], ['Botão direito', 'Colocar'], ['1–9', 'Inventário']],
    color: '#2ecc71',
    art: artBlocos,
  },
  {
    id: 'gol-de-placa',
    title: 'Gol de Placa',
    genre: 'Esporte • Futebol',
    category: 'Esporte',
    status: 'soon',
    url: '',
    players: '2–10 jogadores',
    platform: 'Navegador',
    rating: 'Livre',
    short: 'Partidas rápidas de futebol entre turmas.',
    desc: 'Futebol arcade com partidas de 5 minutos. Monte seu time, escolha a tática e dispute o campeonato entre turmas.',
    controls: [['WASD', 'Mover'], ['J', 'Passe'], ['K', 'Chute'], ['L', 'Carrinho']],

  },
  {

    platform: 'Navegador / Celular',
    rating: 'Livre',
    short: 'Perguntas de tecnologia, lógica e programação.',
    desc: 'Teste seus conhecimentos em tecnologia, lógica, eletrônica e programação. Responda rápido para ganhar mais pontos e desafie a sala inteira ao vivo.',
    controls: [['Clique', 'Responder'], ['1–4', 'Alternativas']],

    art: artQuiz,
  },
  {
    id: 'robo-runner',
    title: 'Robô Runner',
    genre: 'Plataforma • Ação',

// =====================================================================
// Capas procedurais (canvas 2D)
// =====================================================================
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function grad(ctx, y0, y1, stops) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}

function artPoeira(ctx, w, h) {
  const r = rng(7);
  ctx.fillStyle = grad(ctx, 0, h, [[0, '#2a1838'], [.45, '#b4553a'], [.7, '#e9a35a'], [1, '#e9a35a']]);
  ctx.fillRect(0, 0, w, h);
  // sol
  const sx = w * .72, sy = h * .55;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, h * .5);
  sg.addColorStop(0, 'rgba(255,230,160,.95)'); sg.addColorStop(.18, 'rgba(255,190,110,.6)'); sg.addColorStop(1, 'rgba(255,150,80,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, w, h);
  // prédios ao fundo
  ctx.fillStyle = '#5a2e2c';
  for (let x = 0; x < w;) {
    const bw = w * (.05 + r() * .08), bh = h * (.12 + r() * .22);
    ctx.fillRect(x, h * .66 - bh, bw, bh + 2);
    x += bw + w * .01;
  }
  // chão / dunas low-poly
  ctx.fillStyle = '#7a4a2c';
  ctx.beginPath(); ctx.moveTo(0, h);
  for (let i = 0; i <= 8; i++) ctx.lineTo(w * i / 8, h * (.64 + r() * .06));
  ctx.lineTo(w, h); ctx.fill();
  ctx.fillStyle = '#5c3520';
  ctx.beginPath(); ctx.moveTo(0, h);
  for (let i = 0; i <= 6; i++) ctx.lineTo(w * i / 6, h * (.8 + r() * .06));
  ctx.lineTo(w, h); ctx.fill();
  // zumbis em silhueta
  ctx.fillStyle = '#1a0f12';
  const zs = [[.18, .72, .9], [.33, .75, 1.15], [.52, .7, .75], [.6, .78, 1.4], [.86, .73, 1]];
  zs.forEach(([zx, zy, s]) => zombie(ctx, w * zx, h * zy, h * .16 * s, r));
  // poeira
  for (let i = 0; i < 70; i++) {
    ctx.fillStyle = `rgba(255,220,170,${r() * .35})`;
    ctx.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2);
  }
  // mira
  ctx.strokeStyle = 'rgba(120,255,120,.85)'; ctx.lineWidth = Math.max(1.5, h * .006);
  const cx = w * .6, cy = h * .6, g = h * .025, l = h * .06;
  ctx.beginPath();
  ctx.moveTo(cx - g - l, cy); ctx.lineTo(cx - g, cy); ctx.moveTo(cx + g, cy); ctx.lineTo(cx + g + l, cy);
  ctx.moveTo(cx, cy - g - l); ctx.lineTo(cx, cy - g); ctx.moveTo(cx, cy + g); ctx.lineTo(cx, cy + g + l);
  ctx.stroke();
}
function zombie(ctx, x, y, s, r) {
  const lean = (r() - .5) * .3;
  ctx.save(); ctx.translate(x, y); ctx.rotate(lean);
  ctx.fillRect(-s * .09, -s * .95, s * .18, s * .18);           // cabeça
  ctx.fillRect(-s * .13, -s * .76, s * .26, s * .42);           // tronco
  ctx.fillRect(-s * .12, -s * .34, s * .1, s * .34);            // pernas
  ctx.fillRect(s * .02, -s * .34, s * .1, s * .34);
  ctx.save(); ctx.translate(s * .1, -s * .7); ctx.rotate(-1.3 + r() * .3);
  ctx.fillRect(0, -s * .04, s * .38, s * .08); ctx.restore();   // braços esticados
  ctx.save(); ctx.translate(s * .06, -s * .62); ctx.rotate(-1.1 + r() * .3);
  ctx.fillRect(0, -s * .04, s * .36, s * .08); ctx.restore();
  ctx.restore();
}

function artCorrida(ctx, w, h) {
  ctx.fillStyle = grad(ctx, 0, h, [[0, '#0d0221'], [.5, '#3a0ca3'], [.52, '#120326'], [1, '#05010d']]);
  ctx.fillRect(0, 0, w, h);
  const hy = h * .5;
  // sol neon
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, hy); ctx.clip();
  ctx.fillStyle = grad(ctx, hy - h * .35, hy, [[0, '#ffd166'], [1, '#f72585']]);
  ctx.beginPath(); ctx.arc(w / 2, hy, h * .3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a0ca3';
  for (let i = 1; i < 6; i++) ctx.fillRect(0, hy - i * h * .045, w, h * .008 * i * .6);
  ctx.restore();
  // grade em perspectiva
  ctx.strokeStyle = 'rgba(247,37,133,.7)'; ctx.lineWidth = 1.5;
  for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(w / 2, hy); ctx.lineTo(w / 2 + i * w * .12, h); ctx.stroke(); }
  for (let i = 1; i < 10; i++) { const y = hy + (h - hy) * Math.pow(i / 10, 2); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  // pista
  ctx.fillStyle = 'rgba(10,0,20,.85)';
  ctx.beginPath(); ctx.moveTo(w * .48, hy); ctx.lineTo(w * .52, hy); ctx.lineTo(w * .8, h); ctx.lineTo(w * .2, h); ctx.fill();
  ctx.strokeStyle = '#4cc9f0'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(w * .48, hy); ctx.lineTo(w * .2, h); ctx.moveTo(w * .52, hy); ctx.lineTo(w * .8, h); ctx.stroke();
  // carro
  const cx = w / 2, cy = h * .85, s = h * .14;
  ctx.fillStyle = '#f72585';
  ctx.beginPath(); ctx.moveTo(cx - s * 1.2, cy); ctx.lineTo(cx - s, cy - s * .45); ctx.lineTo(cx + s, cy - s * .45); ctx.lineTo(cx + s * 1.2, cy); ctx.fill();
  ctx.fillStyle = '#12021f'; ctx.fillRect(cx - s * .6, cy - s * .75, s * 1.2, s * .32);
  ctx.fillStyle = '#ff006e'; ctx.fillRect(cx - s * 1.05, cy - s * .3, s * .35, s * .12); ctx.fillRect(cx + s * .7, cy - s * .3, s * .35, s * .12);
}

function artBlocos(ctx, w, h) {
  const r = rng(3);
  ctx.fillStyle = grad(ctx, 0, h, [[0, '#4fc3f7'], [1, '#b3e5fc']]); ctx.fillRect(0, 0, w, h);
  const s = h * .11;
  const cube = (x, y, top, left, right) => {
    ctx.fillStyle = top; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s, y - s * .5); ctx.lineTo(x + 2 * s, y); ctx.lineTo(x + s, y + s * .5); ctx.fill();
    ctx.fillStyle = left; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s, y + s * .5); ctx.lineTo(x + s, y + s * 1.5); ctx.lineTo(x, y + s); ctx.fill();
    ctx.fillStyle = right; ctx.beginPath(); ctx.moveTo(x + 2 * s, y); ctx.lineTo(x + s, y + s * .5); ctx.lineTo(x + s, y + s * 1.5); ctx.lineTo(x + 2 * s, y + s); ctx.fill();
  };
  const ox = w / 2 - s, oy = h * .22;
  for (let gy = 0; gy < 7; gy++) for (let gx = 0; gx < 7; gx++) {
    const height = gx === 3 && gy === 3 ? 3 : (r() < .25 ? 2 : 1);
    for (let z = 0; z < height; z++) {
      const x = ox + (gx - gy) * s, y = oy + (gx + gy) * s * .5 - z * s;
      if (z === height - 1 && height > 1 && !(gx === 3 && gy === 3)) cube(x, y, '#9e9e9e', '#757575', '#616161');
      else if (gx === 3 && gy === 3 && z === 2) cube(x, y, '#ef5350', '#c62828', '#b71c1c');
      else cube(x, y, '#66bb6a', '#8d6e63', '#6d4c41');
    }
  }
}

function artFutebol(ctx, w, h) {
  for (let i = 0; i < 10; i++) { ctx.fillStyle = i % 2 ? '#2e9e4f' : '#279045'; ctx.fillRect(w * i / 10, 0, w / 10 + 1, h); }
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(2, h * .012);
  const m = h * .08;
  ctx.strokeRect(m, m, w - 2 * m, h - 2 * m);
  ctx.beginPath(); ctx.moveTo(w / 2, m); ctx.lineTo(w / 2, h - m); ctx.stroke();
  ctx.beginPath(); ctx.arc(w / 2, h / 2, h * .17, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeRect(m, h * .28, w * .12, h * .44); ctx.strokeRect(w - m - w * .12, h * .28, w * .12, h * .44);
  // bola
  const bx = w * .62, by = h * .55, br = h * .09;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(bx + Math.cos(a) * br * .62, by + Math.sin(a) * br * .62, br * .2, 0, Math.PI * 2); ctx.fill(); }
  ctx.beginPath(); ctx.arc(bx, by, br * .26, 0, Math.PI * 2); ctx.fill();
  // rastro
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = br * .5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx - br * 4, by + br * 1.2); ctx.quadraticCurveTo(bx - br * 2, by + br * .2, bx - br * 1.2, by); ctx.stroke();
}

function artQuiz(ctx, w, h) {
  ctx.fillStyle = grad(ctx, 0, h, [[0, '#023e8a'], [1, '#0096c7']]); ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.font = `700 ${h * .12}px monospace`;
  const r = rng(11);
  for (let i = 0; i < 18; i++) ctx.fillText(r() < .5 ? '0' : '1', r() * w, r() * h);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 ${h * .5}px Rajdhani, sans-serif`; ctx.fillText('?', w / 2, h * .42);
  const cols = ['#e63946', '#2a9d8f', '#e9c46a', '#8338ec'];
  const bw = w * .2, bh = h * .12, gap = w * .02, y = h * .78;
  cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(w / 2 - 2 * bw - 1.5 * gap + i * (bw + gap), y, bw, bh); });
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

function artRunner(ctx, w, h) {
  ctx.fillStyle = grad(ctx, 0, h, [[0, '#3d2c1e'], [1, '#1b1410']]); ctx.fillRect(0, 0, w, h);
  // engrenagens ao fundo
  const gear = (x, y, rad, teeth, col) => {
    ctx.fillStyle = col; ctx.beginPath();
    for (let i = 0; i < teeth * 2; i++) { const a = i * Math.PI / teeth, rr = i % 2 ? rad : rad * 1.2; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.fill(); ctx.fillStyle = '#2b2018'; ctx.beginPath(); ctx.arc(x, y, rad * .35, 0, Math.PI * 2); ctx.fill();
  };
  gear(w * .15, h * .3, h * .2, 10, '#5a4330'); gear(w * .85, h * .25, h * .15, 8, '#5a4330'); gear(w * .7, h * .5, h * .1, 8, '#4a3626');
  // esteira
  ctx.fillStyle = '#222'; ctx.fillRect(0, h * .78, w, h * .22);
  ctx.fillStyle = '#ffb703';
  for (let x = 0; x < w; x += h * .12) { ctx.beginPath(); ctx.moveTo(x, h * .78); ctx.lineTo(x + h * .06, h * .78); ctx.lineTo(x + h * .02, h * .84); ctx.lineTo(x - h * .04, h * .84); ctx.fill(); }
  // robô pulando
  const rx = w * .42, ry = h * .48, s = h * .2;
  ctx.fillStyle = '#ff9f1c'; ctx.fillRect(rx, ry, s * .8, s * .7);
  ctx.fillStyle = '#e0e0e0'; ctx.fillRect(rx + s * .1, ry - s * .5, s * .6, s * .45);
  ctx.fillStyle = '#00e5ff'; ctx.fillRect(rx + s * .2, ry - s * .38, s * .14, s * .14); ctx.fillRect(rx + s * .46, ry - s * .38, s * .14, s * .14);
  ctx.fillStyle = '#bdbdbd'; ctx.fillRect(rx + s * .05, ry + s * .7, s * .2, s * .35); ctx.fillRect(rx + s * .55, ry + s * .7, s * .2, s * .25);
  ctx.fillRect(rx + s * .38, ry - s * .75, s * .04, s * .25);
  ctx.fillStyle = '#ff1744'; ctx.beginPath(); ctx.arc(rx + s * .4, ry - s * .78, s * .06, 0, Math.PI * 2); ctx.fill();
  // engrenagem coletável
  gear(w * .75, h * .62, h * .05, 8, '#ffd60a');
}

// Desenha a capa no canvas respeitando o tamanho real e a densidade da tela.
function paint(canvas, game) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 320, h = canvas.clientHeight || 200;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  game.art(ctx, w, h);
}

// =====================================================================
// Contas (salvas no localStorage deste navegador)
// =====================================================================
const Auth = (() => {
  const USERS = 'senai_users', SESSION = 'senai_session';
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  async function hash(text) {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) | 0;
    return 'djb2-' + (h >>> 0).toString(16);
  }

  return {
    async signup(name, pass) {
      const users = load(USERS, {});
      const key = name.toLowerCase();
      if (users[key]) throw new Error('Esse usuário já existe.');
      users[key] = { name, pass: await hash(key + ':' + pass), created: Date.now() };
      save(USERS, users);
      save(SESSION, key);
      return users[key];
    },
    async login(name, pass) {
      const users = load(USERS, {});
      const key = name.toLowerCase();
      const u = users[key];
      if (!u || u.pass !== await hash(key + ':' + pass)) throw new Error('Usuário ou senha incorretos.');
      save(SESSION, key);
      return u;
    },
    current() { const key = load(SESSION, null); return key ? load(USERS, {})[key] || null : null; },
    logout() { try { localStorage.removeItem(SESSION); } catch {} },
  };
})();

// =====================================================================
// Interface
// =====================================================================
const $ = id => document.getElementById(id);
let mode = 'login', filter = 'Todos', openGame = null;

function setMode(m) {
  mode = m;
  $('tabLogin').classList.toggle('on', m === 'login');
  $('tabSignup').classList.toggle('on', m === 'signup');
  $('confirmWrap').classList.toggle('hidden', m === 'login');
  $('fPass2').required = m === 'signup';
  $('fPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('authBtn').textContent = m === 'login' ? 'Entrar' : 'Criar conta';
  showMsg('');
}
function showMsg(text, ok) { const el = $('authMsg'); el.textContent = text; el.classList.toggle('ok', !!ok); }

$('tabLogin').onclick = () => setMode('login');
$('tabSignup').onclick = () => setMode('signup');

$('authForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('fUser').value.trim(), pass = $('fPass').value;
  if (!/^[\wÀ-ÿ.\- ]{3,20}$/.test(name)) return showMsg('Usuário deve ter de 3 a 20 caracteres (letras, números, . _ -).');
  if (pass.length < 4) return showMsg('A senha precisa de pelo menos 4 caracteres.');
  try {
    if (mode === 'signup') {
      if (pass !== $('fPass2').value) return showMsg('As senhas não conferem.');
      await Auth.signup(name, pass);
    } else {
      await Auth.login(name, pass);
    }
    $('authForm').reset();
    enterHub();
  } catch (err) { showMsg(err.message); }
};

$('logout').onclick = () => { Auth.logout(); closeGame(); $('hub').classList.add('hidden'); $('auth').classList.remove('hidden'); setMode('login'); };

function avatarColor(name) {
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 65% 45%)`;
}

function enterHub() {
  const u = Auth.current();
  if (!u) return;
  $('auth').classList.add('hidden');
  $('hub').classList.remove('hidden');
  $('userName').textContent = u.name;
  $('avatar').textContent = u.name[0].toUpperCase();
  $('avatar').style.background = avatarColor(u.name);
  const feat = GAMES.find(g => g.status === 'live') || GAMES[0];
  $('heroTitle').textContent = feat.title;
  $('heroDesc').textContent = feat.short;
  $('hero').onclick = () => showGame(feat);
  renderChips();
  renderGrid();
  requestAnimationFrame(() => paint($('heroCanvas'), feat));
}

function renderChips() {
  const cats = ['Todos', ...new Set(GAMES.map(g => g.category))];
  $('chips').innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (c === filter ? ' on' : ''); b.textContent = c;
    b.onclick = () => { filter = c; renderChips(); renderGrid(); };
    $('chips').appendChild(b);
  });
}

function renderGrid() {
  const q = $('search').value.trim().toLowerCase();
  const list = GAMES.filter(g =>
    (filter === 'Todos' || g.category === filter) &&
    (!q || (g.title + ' ' + g.genre).toLowerCase().includes(q)));
  const grid = $('grid');
  grid.innerHTML = '';
  if (!list.length) { grid.innerHTML = '<div class="empty">Nenhum jogo encontrado.</div>'; return; }
  list.forEach(g => {
    const card = document.createElement('button');
    card.type = 'button'; card.className = 'card';
    card.innerHTML = `
      <div class="thumb"><canvas></canvas><span class="badge ${g.status}">${g.status === 'live' ? 'Jogar agora' : 'Em breve'}</span></div>
      <div class="body"><h4></h4><div class="meta"><span></span></div></div>`;
    card.querySelector('h4').textContent = g.title;
    card.querySelector('.meta span').textContent = g.genre;
    card.onclick = () => showGame(g);
    grid.appendChild(card);
  });
  requestAnimationFrame(() => grid.querySelectorAll('.card').forEach((c, i) => paint(c.querySelector('canvas'), list[i])));
}
$('search').oninput = renderGrid;

function showGame(g) {
  openGame = g;
  $('mTitle').textContent = g.title;
  $('mGenre').textContent = g.genre;
  $('mDesc').textContent = g.desc;
  $('mStats').innerHTML = '';
  [['Jogadores', g.players], ['Plataforma', g.platform], ['Classificação', g.rating], ['Status', g.status === 'live' ? 'Disponível' : 'Em breve']]
    .forEach(([k, v]) => {
      const d = document.createElement('div'); d.className = 'stat';
      d.innerHTML = '<small></small><span></span>';
      d.querySelector('small').textContent = k; d.querySelector('span').textContent = v;
      $('mStats').appendChild(d);
    });
  $('mControls').innerHTML = '';
  g.controls.forEach(([k, v]) => {
    const d = document.createElement('div');
    d.innerHTML = '<kbd></kbd>'; d.querySelector('kbd').textContent = k; d.append(v);
    $('mControls').appendChild(d);
  });
  const live = g.status === 'live' && g.url;
  $('mPlay').disabled = !live;
  $('mPlay').innerHTML = live ? '&#9654; Jogar' : 'Em breve';
  $('overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => paint($('mCanvas'), g));
  $('mPlay').focus();
}
function closeGame() { openGame = null; $('overlay').classList.add('hidden'); document.body.style.overflow = ''; }

$('mPlay').onclick = () => { if (openGame && openGame.status === 'live' && openGame.url) window.location.href = openGame.url; };
$('mClose').onclick = closeGame;
$('mBack').onclick = closeGame;
$('overlay').onclick = e => { if (e.target === $('overlay')) closeGame(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openGame) closeGame(); });

let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if ($('hub').classList.contains('hidden')) return;
    renderGrid();
    paint($('heroCanvas'), GAMES.find(g => g.status === 'live') || GAMES[0]);
    if (openGame) paint($('mCanvas'), openGame);
  }, 150);
});

if (Auth.current()) enterHub();
</script>
</body>
</html>

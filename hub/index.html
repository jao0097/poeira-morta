<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENAI Esports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d12;
  --bg2: #12151d;
  --card: #171b25;
  --line: #262b38;
  --text: #eef0f5;
  --muted: #8b92a5;
  --red: #e30613;
  --red2: #ff3341;
  --ok: #2ecc71;
  --gold: #ffc53d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, .brand, .btn { font-family: Rajdhani, Inter, sans-serif; letter-spacing: .02em; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
.hidden { display: none !important; }

/* ---------- Marca ---------- */
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; white-space: nowrap; }
.brand .logo {
  width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex: none;
  background: var(--red); font-size: 20px; color: #fff; transform: skewX(-8deg);
  box-shadow: 0 0 18px rgba(227, 6, 19, .45);
}
.brand b { color: var(--red2); font-weight: 700; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 46px; padding: 0 24px; border-radius: 10px; font-weight: 700; font-size: 17px;
  text-transform: uppercase; transition: transform .12s, background .15s, border-color .15s;
}
.btn:active { transform: scale(.97); }
.btn-red { background: var(--red); color: #fff; box-shadow: 0 6px 20px rgba(227, 6, 19, .35); }
.btn-red:hover { background: var(--red2); }
.btn-ghost { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14); }
.btn-ghost:hover { border-color: rgba(255, 255, 255, .4); }
.btn svg { width: 18px; height: 18px; }

/* ---------- Login ---------- */
#auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.auth-art { position: relative; overflow: hidden; background: #000; }
.auth-art img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transition: opacity 1.2s; transform: scale(1.04);
}
.auth-art img.on { opacity: .75; animation: zoom 9s linear forwards; }
@keyframes zoom { to { transform: scale(1.12); } }
.auth-art::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 40%, var(--bg)), linear-gradient(0deg, rgba(0,0,0,.7), transparent 50%);
}
.auth-art .caption { position: absolute; left: 40px; bottom: 40px; z-index: 1; max-width: 420px; }
.auth-art .caption h1 { font-size: 52px; line-height: 1; margin-bottom: 10px; }
.auth-art .caption p { color: #d0d4de; }
.auth-side {
  display: grid; place-items: center; padding: 32px 16px;
  background: radial-gradient(600px 400px at 80% 0%, rgba(227, 6, 19, .18), transparent 70%), var(--bg);
}
.auth-box { width: 100%; max-width: 380px; }
.auth-box .brand { font-size: 28px; margin-bottom: 6px; }
.auth-box .sub { color: var(--muted); margin-bottom: 26px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 22px; }
.tabs button { height: 38px; border-radius: 9px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
.tabs button.on { background: var(--red); color: #fff; }
.field { margin-bottom: 14px; position: relative; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input {
  width: 100%; height: 48px; padding: 0 14px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--line); outline: none; transition: border-color .15s, box-shadow .15s;
}
.field input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(227, 6, 19, .2); }
.field .eye { position: absolute; right: 8px; bottom: 8px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12px; color: var(--muted); }
.field .eye:hover { color: var(--text); background: var(--line); }
.field.pw input { padding-right: 70px; }
.auth-box .btn { width: 100%; margin-top: 8px; }
.msg { min-height: 22px; font-size: 13px; margin-top: 12px; color: var(--red2); }
.note { font-size: 12px; color: var(--muted); margin-top: 18px; }

/* ---------- Topo ---------- */
header {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
  padding: 12px 24px; background: rgba(11, 13, 18, .85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.user { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-weight: 700; color: #fff; font-family: Rajdhani, sans-serif; font-size: 19px;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--line);
}
.user .who { line-height: 1.2; }
.user .who small { display: block; color: var(--muted); font-size: 12px; }
.user .who span { font-weight: 600; display: block; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logout { color: var(--muted); font-size: 13px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
.logout:hover { color: var(--text); border-color: var(--muted); }

main { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* ---------- Destaque ---------- */
.hero { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 7; min-height: 320px; border: 1px solid var(--line); background: #000; }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; pointer-events: none; }
.slide.on { opacity: 1; pointer-events: auto; }
.slide img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); transition: transform 7s ease-out; }
.slide.on img { transform: scale(1.08); }
.slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5, 6, 10, .92) 0%, rgba(5, 6, 10, .55) 45%, transparent 75%); }
.slide .info { position: absolute; left: 40px; bottom: 40px; z-index: 1; max-width: 480px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tag { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; text-transform: uppercase; letter-spacing: .06em; background: rgba(8, 10, 15, .72); border: 1px solid rgba(255,255,255,.12); }
.tag.red { background: var(--red); border-color: var(--red); color: #fff; }
.tag.green { background: var(--ok); border-color: var(--ok); color: #062611; }
.slide h2 { font-size: 56px; line-height: .95; margin-bottom: 12px; text-shadow: 0 4px 24px rgba(0,0,0,.5); }
.slide p { color: #d6dae3; margin-bottom: 22px; }
.slide .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.dots { position: absolute; right: 24px; bottom: 24px; z-index: 2; display: flex; gap: 8px; }
.dots button { width: 10px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.35); transition: width .25s, background .25s; }
.dots button.on { width: 28px; background: #fff; }

/* ---------- Biblioteca ---------- */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 36px 0 16px; }
.section-head h3 { font-size: 26px; }
.section-head span { color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
.card {
  position: relative; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  overflow: hidden; transition: transform .2s, border-color .2s, box-shadow .2s;
}
.card:hover { transform: translateY(-5px); border-color: var(--accent, var(--red)); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
.card .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.card:hover .thumb img { transform: scale(1.06); }
.card .thumb .tags { position: absolute; top: 12px; left: 12px; }
.card .play-hint {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.35);
  opacity: 0; transition: opacity .2s;
}
.card:hover .play-hint { opacity: 1; }
.play-hint span { width: 64px; height: 64px; border-radius: 50%; background: var(--red); display: grid; place-items: center; box-shadow: 0 8px 30px rgba(227,6,19,.5); }
.play-hint svg { width: 26px; height: 26px; margin-left: 4px; }
.card .body { padding: 14px 16px 16px; display: flex; align-items: center; gap: 12px; }
.card h4 { font-size: 24px; line-height: 1.1; }
.card .meta { color: var(--muted); font-size: 13px; }
.card .count { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.card .count b { display: block; font-family: Rajdhani, sans-serif; font-size: 20px; color: var(--text); }

footer { text-align: center; color: var(--muted); font-size: 13px; padding: 48px 16px 32px; }

/* ---------- Janela do jogo ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .75); backdrop-filter: blur(6px);
  display: grid; place-items: center; padding: 16px; animation: fade .15s;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  position: relative; width: 100%; max-width: 860px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; animation: pop .2s;
}
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
.modal .cover { position: relative; aspect-ratio: 16 / 8; }
.modal .cover img { width: 100%; height: 100%; object-fit: cover; }
.modal .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--card) 2%, transparent 50%); }
.close {
  position: absolute; top: 14px; right: 14px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
  background: rgba(0, 0, 0, .6); font-size: 22px; line-height: 1;
}
.close:hover { background: var(--red); }
.modal .content { padding: 0 30px 30px; margin-top: -60px; position: relative; z-index: 1; }
.modal h2 { font-size: 46px; line-height: 1; margin-bottom: 4px; }
.modal .genre { color: var(--accent, var(--red2)); font-weight: 600; margin-bottom: 14px; }
.modal .desc { color: #d0d4de; margin-bottom: 18px; }
.features { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 18px; margin-bottom: 20px; }
.features li { position: relative; padding-left: 18px; color: #d0d4de; font-size: 14px; }
.features li::before { content: ""; position: absolute; left: 0; top: 8px; width: 7px; height: 7px; border-radius: 2px; background: var(--accent, var(--red)); transform: rotate(45deg); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat span { font-weight: 600; }
.modal h5 { font-family: Rajdhani, sans-serif; font-size: 18px; margin-bottom: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.controls div { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--muted); }
.controls kbd { font-family: inherit; font-weight: 700; color: var(--text); margin-right: 6px; }
.modal .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.modal .actions .btn-red { min-width: 200px; }
.modal .warn { font-size: 13px; color: var(--gold); }

/* ---------- Tela de carregamento ---------- */
#launch {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; text-align: center;
  background: var(--bg); animation: fade .25s;
}
#launch img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .25; filter: blur(4px); }
#launch .box { position: relative; }
#launch h2 { font-size: 44px; margin-bottom: 4px; }
#launch p { color: var(--muted); margin-bottom: 20px; }
.bar { width: 260px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 0 auto; }
.bar i { display: block; height: 100%; width: 0; background: var(--red); animation: load .9s ease-in forwards; }
@keyframes load { to { width: 100%; } }

@media (max-width: 860px) {
  #auth { grid-template-columns: 1fr; }
  .auth-art { min-height: 240px; }
  .auth-art::after { background: linear-gradient(0deg, var(--bg), transparent 70%); }
  .auth-art .caption { left: 16px; bottom: 16px; }
  .auth-art .caption h1 { font-size: 36px; }
}
@media (max-width: 640px) {
  header { padding: 10px 16px; gap: 10px; }
  .brand { font-size: 19px; }
  .user .who { display: none; }
  main { padding: 16px; }
  .hero { aspect-ratio: auto; min-height: 420px; }
  .slide::after { background: linear-gradient(0deg, rgba(5, 6, 10, .95) 15%, transparent 75%); }
  .slide .info { left: 18px; right: 18px; bottom: 44px; }
  .slide h2 { font-size: 40px; }
  .dots { left: 18px; right: auto; bottom: 18px; }
  .grid { grid-template-columns: 1fr; }
  .modal .content { padding: 0 18px 20px; margin-top: -40px; }
  .modal h2 { font-size: 34px; }
  .modal .actions .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<section id="auth">
  <div class="auth-art" id="authArt">
    <div class="caption">
      <h1>Jogue com a sua turma.</h1>
      <p>Os jogos do SENAI em um só lugar.</p>
    </div>
  </div>
  <div class="auth-side">
    <div class="auth-box">
      <div class="brand"><div class="logo">S</div>SENAI <b>Esports</b></div>
      <p class="sub">Entre para acessar os jogos</p>
      <div class="tabs">
        <button type="button" id="tabLogin" class="on">Entrar</button>
        <button type="button" id="tabSignup">Criar conta</button>
      </div>
      <form id="authForm" autocomplete="on" novalidate>
        <div class="field">
          <label for="fUser">Usuário</label>
          <input id="fUser" name="username" autocomplete="username" maxlength="20" required>
        </div>
        <div class="field pw">
          <label for="fPass">Senha</label>
          <input id="fPass" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="eye" id="eye">Mostrar</button>
        </div>
        <div class="field hidden" id="confirmWrap">
          <label for="fPass2">Confirmar senha</label>
          <input id="fPass2" type="password" autocomplete="new-password">
        </div>
        <button class="btn btn-red" id="authBtn" type="submit">Entrar</button>
        <div class="msg" id="authMsg" role="alert"></div>
      </form>
      <p class="note">As contas ficam salvas neste navegador.</p>
    </div>
  </div>
</section>

<!-- ======================= HUB ======================= -->
<section id="hub" class="hidden">
  <header>
    <div class="brand"><div class="logo">S</div><span>SENAI <b>Esports</b></span></div>
    <div class="user">
      <div class="avatar" id="avatar"></div>
      <div class="who"><small id="greet"></small><span id="userName"></span></div>
      <button class="logout" id="logout" type="button">Sair</button>
    </div>
  </header>

  <main>
    <div class="hero" id="hero"></div>

    <div class="section-head">
      <h3>Jogos</h3>
      <span id="libCount"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <footer>SENAI Esports &middot; Hub de jogos</footer>
</section>

<!-- ======================= JANELA DO JOGO ======================= -->
<div class="overlay hidden" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose" type="button" aria-label="Fechar">&times;</button>
    <div class="cover"><img id="mImg" alt=""></div>
    <div class="content">
      <div class="tags" id="mTags"></div>
      <h2 id="mTitle"></h2>
      <div class="genre" id="mGenre"></div>
      <p class="desc" id="mDesc"></p>
      <ul class="features" id="mFeatures"></ul>
      <div class="stats" id="mStats"></div>
      <h5>Controles</h5>
      <div class="controls" id="mControls"></div>
      <div class="actions">
        <button class="btn btn-red" id="mPlay" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Jogar</button>
        <button class="btn btn-ghost" id="mBack" type="button">Voltar</button>
        <span class="warn" id="mWarn"></span>
      </div>
    </div>
  </div>
</div>

<!-- ======================= CARREGANDO ======================= -->
<div id="launch" class="hidden">
  <img id="lImg" alt="">
  <div class="box">
    <h2 id="lTitle"></h2>
    <p>Abrindo o jogo...</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<script>
// =====================================================================
// Jogos do hub. `url` é para onde o botão Jogar leva.
// =====================================================================
const GAMES = [
  {
    id: 'poeira-morta',
    title: 'Poeira Morta',
    genre: 'FPS de sobrevivência',
    url: '../poeira-morta.html',
    img: 'img/poeira-morta.jpg',
    accent: '#e0a458',
    tags: [['Tiro', ''], ['Zumbis', ''], ['1 jogador', '']],
    short: 'Sobreviva a ondas de zumbis numa cidade tomada pela poeira.',
    desc: 'FPS no estilo clássico do CS 1.6. Cada abate dá dinheiro para comprar armas nas paredes; cada morte cobra tudo. Aguente as ondas, derrote os chefes e evolua seu personagem na Oficina.',
    features: [
      'Ondas de zumbis cada vez maiores, com chefes',
      'Armas compradas nas paredes do mapa',
      'Ciclo de dia e noite',
      'Oficina com melhorias permanentes',
      'Três dificuldades: Fácil, Normal e Difícil',
    ],
    stats: [['Jogadores', '1'], ['Plataforma', 'PC (navegador)'], ['Modo', 'Sobrevivência'], ['Classificação', '14+']],
    controls: [['WASD', 'Mover'], ['Mouse', 'Mirar'], ['Clique', 'Atirar'], ['R', 'Recarregar'], ['E', 'Comprar'], ['Espaço', 'Pular'], ['Ctrl', 'Agachar'], ['G', 'Granada']],
    warn: 'Precisa de teclado e mouse.',
  },
  {
    id: 'senai-rush',
    title: 'SENAI Rush',
    genre: 'Corrida de kart 3D',
    url: 'https://senai-rush.onrender.com/',
    img: 'img/senai-rush.jpg',
    accent: '#ffc53d',
    tags: [['Corrida', ''], ['Online', 'green'], ['Até 8 jogadores', '']],
    short: 'Corrida arcade de kart pelo campus do SENAI Pompéia.',
    desc: 'Escolha seu piloto, acelere por oito pistas e use os itens para passar os rivais. Corra sozinho, em tela dividida com os amigos ou online numa sala com código.',
    features: [
      '8 pistas, do Campus SENAI à Neon Avenue',
      '9 pilotos com atributos diferentes',
      'Drift com turbo e itens nas caixas',
      'Online por código de sala e tela dividida',
      'Quatro dificuldades: 50cc a 200cc',
    ],
    stats: [['Jogadores', '1 a 8'], ['Plataforma', 'PC e celular'], ['Modo', 'Corrida / Online'], ['Classificação', 'Livre']],
    controls: [['WASD / Setas', 'Dirigir'], ['Shift', 'Drift'], ['Espaço', 'Item'], ['C', 'Olhar para trás'], ['Esc', 'Pausar']],
    warn: '',
  },
];

// =====================================================================
// Contas e estatísticas (salvas no localStorage deste navegador)
// =====================================================================
const Store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

const Auth = (() => {
  const USERS = 'senai_users', SESSION = 'senai_session';
  async function hash(text) {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) | 0;
    return 'djb2-' + (h >>> 0).toString(16);
  }
  return {
    async signup(name, pass) {
      const users = Store.get(USERS, {}), key = name.toLowerCase();
      if (users[key]) throw new Error('Esse usuário já existe.');
      users[key] = { name, pass: await hash(key + ':' + pass), created: Date.now(), plays: {} };
      Store.set(USERS, users); Store.set(SESSION, key);
    },
    async login(name, pass) {
      const users = Store.get(USERS, {}), key = name.toLowerCase(), u = users[key];
      if (!u || u.pass !== await hash(key + ':' + pass)) throw new Error('Usuário ou senha incorretos.');
      Store.set(SESSION, key);
    },
    current() { const key = Store.get(SESSION, null); return key ? Store.get(USERS, {})[key] || null : null; },
    addPlay(gameId) {
      const key = Store.get(SESSION, null), users = Store.get(USERS, {});
      if (!users[key]) return;
      const plays = users[key].plays || (users[key].plays = {});
      plays[gameId] = (plays[gameId] || 0) + 1;
      Store.set(USERS, users);
    },
    logout() { Store.del(SESSION); },
  };
})();

// =====================================================================
// Interface
// =====================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
let mode = 'login', openGame = null, slide = 0, slideTimer = null, artTimer = null;

// ---------- Login ----------
function setMode(m) {
  mode = m;
  $('tabLogin').classList.toggle('on', m === 'login');
  $('tabSignup').classList.toggle('on', m === 'signup');
  $('confirmWrap').classList.toggle('hidden', m === 'login');
  $('fPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('authBtn').textContent = m === 'login' ? 'Entrar' : 'Criar conta';
  $('authMsg').textContent = '';
}
$('tabLogin').onclick = () => setMode('login');
$('tabSignup').onclick = () => setMode('signup');
$('eye').onclick = () => {
  const show = $('fPass').type === 'password';
  $('fPass').type = $('fPass2').type = show ? 'text' : 'password';
  $('eye').textContent = show ? 'Ocultar' : 'Mostrar';
};

$('authForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('fUser').value.trim(), pass = $('fPass').value, say = t => $('authMsg').textContent = t;
  if (!/^[\wÀ-ÿ.\- ]{3,20}$/.test(name)) return say('O usuário deve ter de 3 a 20 caracteres (letras, números, . _ -).');
  if (pass.length < 4) return say('A senha precisa de pelo menos 4 caracteres.');
  try {
    if (mode === 'signup') {
      if (pass !== $('fPass2').value) return say('As senhas não conferem.');
      await Auth.signup(name, pass);
    } else {
      await Auth.login(name, pass);
    }
    $('authForm').reset();
    enterHub();
  } catch (err) { say(err.message); }
};

// Fundo do login alternando as fotos dos jogos.
function startAuthArt() {
  const art = $('authArt');
  if (!art.querySelector('img')) GAMES.forEach(g => { const i = new Image(); i.src = g.img; i.alt = ''; art.prepend(i); });
  const imgs = [...art.querySelectorAll('img')];
  let i = 0;
  const step = () => { imgs.forEach((im, k) => im.classList.toggle('on', k === i)); i = (i + 1) % imgs.length; };
  step(); clearInterval(artTimer); artTimer = setInterval(step, 7000);
}

$('logout').onclick = () => {
  Auth.logout(); closeGame(); clearInterval(slideTimer);
  $('hub').classList.add('hidden'); $('auth').classList.remove('hidden');
  setMode('login'); startAuthArt();
};

// ---------- Hub ----------
function avatarColor(name) {
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 65% 45%)`;
}
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}
const tagsHtml = g => g.tags.map(([t, c]) => `<span class="tag ${c}">${esc(t)}</span>`).join('');

function enterHub() {
  const u = Auth.current();
  if (!u) return startAuthArt();
  clearInterval(artTimer);
  $('auth').classList.add('hidden');
  $('hub').classList.remove('hidden');
  $('userName').textContent = u.name;
  $('greet').textContent = greeting() + ',';
  $('avatar').textContent = u.name[0].toUpperCase();
  $('avatar').style.background = avatarColor(u.name);
  renderHero();
  renderGrid();
}

function renderHero() {
  const hero = $('hero');
  hero.innerHTML = GAMES.map((g, i) => `
    <div class="slide" data-i="${i}">
      <img src="${esc(g.img)}" alt="">
      <div class="info">
        <div class="tags"><span class="tag red">Destaque</span>${tagsHtml(g)}</div>
        <h2>${esc(g.title)}</h2>
        <p>${esc(g.short)}</p>
        <div class="actions">
          <button class="btn btn-red" type="button" data-play="${i}">${PLAY_ICON}Jogar</button>
          <button class="btn btn-ghost" type="button" data-info="${i}">Ver detalhes</button>
        </div>
      </div>
    </div>`).join('') +
    `<div class="dots">${GAMES.map((g, i) => `<button type="button" aria-label="${esc(g.title)}" data-dot="${i}"></button>`).join('')}</div>`;
  hero.querySelectorAll('[data-play]').forEach(b => b.onclick = () => play(GAMES[b.dataset.play]));
  hero.querySelectorAll('[data-info]').forEach(b => b.onclick = () => showGame(GAMES[b.dataset.info]));
  hero.querySelectorAll('[data-dot]').forEach(b => b.onclick = () => { goSlide(+b.dataset.dot); autoSlide(); });
  goSlide(slide);
  autoSlide();
}
function goSlide(i) {
  slide = (i + GAMES.length) % GAMES.length;
  $('hero').querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('on', k === slide));
  $('hero').querySelectorAll('[data-dot]').forEach((d, k) => d.classList.toggle('on', k === slide));
}
function autoSlide() { clearInterval(slideTimer); slideTimer = setInterval(() => goSlide(slide + 1), 7000); }

function renderGrid() {
  const plays = (Auth.current() || {}).plays || {};
  $('libCount').textContent = GAMES.length + ' jogos disponíveis';
  $('grid').innerHTML = GAMES.map((g, i) => `
    <button class="card" type="button" data-i="${i}" style="--accent:${g.accent}">
      <div class="thumb">
        <img src="${esc(g.img)}" alt="${esc(g.title)}" loading="lazy">
        <div class="tags">${tagsHtml(g)}</div>
        <div class="play-hint"><span>${PLAY_ICON}</span></div>
      </div>
      <div class="body">
        <div><h4>${esc(g.title)}</h4><div class="meta">${esc(g.genre)}</div></div>
        <div class="count"><b>${plays[g.id] || 0}</b>partidas</div>
      </div>
    </button>`).join('');
  $('grid').querySelectorAll('.card').forEach(c => c.onclick = () => showGame(GAMES[c.dataset.i]));
}

// ---------- Janela do jogo ----------
function showGame(g) {
  openGame = g;
  document.querySelector('.modal').style.setProperty('--accent', g.accent);
  $('mImg').src = g.img; $('mImg').alt = g.title;
  $('mTags').innerHTML = tagsHtml(g);
  $('mTitle').textContent = g.title;
  $('mGenre').textContent = g.genre;
  $('mDesc').textContent = g.desc;
  $('mFeatures').innerHTML = g.features.map(f => `<li>${esc(f)}</li>`).join('');
  $('mStats').innerHTML = g.stats.map(([k, v]) => `<div class="stat"><small>${esc(k)}</small><span>${esc(v)}</span></div>`).join('');
  $('mControls').innerHTML = g.controls.map(([k, v]) => `<div><kbd>${esc(k)}</kbd>${esc(v)}</div>`).join('');
  $('mWarn').textContent = g.warn;
  $('overlay').classList.remove('hidden');
  $('overlay').scrollTop = 0; document.querySelector('.modal').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  clearInterval(slideTimer);
  $('mPlay').focus();
}
function closeGame() {
  if (!openGame) return;
  openGame = null; $('overlay').classList.add('hidden'); document.body.style.overflow = '';
  if (!$('hub').classList.contains('hidden')) autoSlide();
}

// Mostra a tela de carregamento e vai para o jogo.
function play(g) {
  Auth.addPlay(g.id);
  $('lImg').src = g.img; $('lTitle').textContent = g.title;
  $('launch').classList.remove('hidden');
  setTimeout(() => { window.location.href = g.url; }, 900);
}

$('mPlay').onclick = () => openGame && play(openGame);
$('mClose').onclick = closeGame;
$('mBack').onclick = closeGame;
$('overlay').onclick = e => { if (e.target === $('overlay')) closeGame(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGame(); });

// Ao voltar do jogo pelo botão "voltar" do navegador, a página pode vir do cache.
window.addEventListener('pageshow', () => {
  $('launch').classList.add('hidden');
  if (Auth.current() && !$('hub').classList.contains('hidden')) renderGrid();
});

enterHub();
</script>
</body>
</html>
